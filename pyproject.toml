[build-system]
requires = ["setuptools>=61.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "chatbot-phapluat"
version = "0.1.0"
description = "Hệ thống Multi-Agent tư vấn pháp luật sử dụng LlamaIndex, Qdrant, Neo4j và Gemini"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    # Thư viện xử lý văn bản & dữ liệu
    "python-docx>=1.1.0",
    "pydantic>=2.0.0",
    
    # LlamaIndex & Vector/Graph DB
    "llama-index>=0.10.0",
    "qdrant-client>=1.7.0",
    "neo4j>=5.0.0",
    
    # Hỗ trợ Gemini API (Thay thế OpenAI)
    "google-generativeai>=0.3.0",
    "llama-index-llms-gemini>=0.1.0",
    
    # Tầng API Service (FastAPI)
    "fastapi>=0.100.0",
    "uvicorn>=0.20.0",
    
    # Công cụ format code (Black & Isort)
    "black>=23.0.0",
    "isort>=5.12.0"
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["*"]

[tool.distutils.egg_info]
egg_base = "build"
